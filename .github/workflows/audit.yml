name: npm audit

# The npm dependencies of the locked install against the npm registry's advisories: every week, on a
# change of the lockfile, and by hand. This version takes fixes of critical defects only, so a
# failure here is one to act on.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm audit --audit-level high
